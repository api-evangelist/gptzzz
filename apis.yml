name: KaiGPT
image: https://gptzzz.ai/blog/assets/og-cover.png
aid: gptzzz
description: KaiGPT (gptzzz.ai, site name "gptzzz.ai", subtitle "AI API 中转服务 中转站") is an independent third-party AI API relay
  (中转站) and multi-model gateway for Chinese-speaking developers. It exposes an OpenAI-compatible interface at https://gptzzz.ai/v1
  (chat completions, Responses, embeddings, images), a Claude Messages route at https://gptzzz.ai/v1/messages and a Gemini-style
  v1beta surface, authenticated with a KaiGPT API key via Authorization Bearer, x-api-key or x-goog-api-key. Model IDs, group
  multipliers and limits are shown only in the logged-in console; the public model plaza lists no models or prices yet. It
  also ships a desktop client that configures Claude Code, Codex, Gemini CLI and OpenCode, and a Chinese knowledge base on
  relay selection, security and compliance. KaiGPT states it is not affiliated with the model vendors it routes to; it resells
  access to other providers' model APIs rather than training models itself.
