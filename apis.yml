name: GPTZZZ

image: https://gptzzz.ai/blog/assets/og-cover-gptzzz.jpg

aid: gptzzz

description: GPTZZZ (gptzzz.ai, subtitle "AI API 中转服务 中转站") is an independent third-party AI API relay
  (中转站) and multi-model gateway for Chinese-speaking developers. It exposes an OpenAI-compatible interface at https://gptzzz.ai/v1
  (chat completions, Responses, embeddings, images), a Claude Messages route at https://gptzzz.ai/v1/messages and a Gemini-style
  v1beta surface, authenticated with a GPTZZZ API key via Authorization Bearer, x-api-key or x-goog-api-key. Public prices are listed at
  https://gptzzz.ai/pricing/ (48 models from 7 vendors in 10 billing groups, also served as JSON at /api/v1/model-plaza),
  billed from a prepaid balance (a ¥1 top-up gives $1 of balance); each API key belongs to one billing group. It also ships a
  desktop client (macOS, Windows x64 and ARM64) that adds GPTZZZ as a provider in Claude Code, Codex, 小龙虾, 爱马仕 and Grok,
  and a Chinese knowledge base on relay selection, security and compliance. The same team runs kaigpt.ai, a separate
  product with separate billing. GPTZZZ states it is not affiliated with the model vendors it routes to; it resells
  access to other providers' model APIs rather than training models itself.

