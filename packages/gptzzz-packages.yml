note: >-
  No first-party SDK or client library was found on a package registry, and the docs point developers at the upstream
  vendors' own SDKs (OpenAI Python SDK etc.) with a changed Base URL. GPTZZZ does ship a desktop configurator, not an SDK:
  the "GPTZZZ desktop client" for macOS / Windows / Windows ARM64 at https://gptzzz.ai/downloads/, version 3.21.0
  (VERSION = "3.21.0" in https://gptzzz.ai/downloads/app.js), GPTZZZ-v3.21.0-macOS.dmg answering 200 with Last-Modified
  2026-09-12. Per the downloads page it supports five tools: Claude Code, Codex, 小龙虾, 爱马仕 and Grok (Gemini CLI and
  OpenCode are not supported). After sign-in it adds GPTZZZ to each tool's provider list without switching to it automatically,
  and the original configuration can be restored in one click. Builds: one universal macOS .dmg, and Windows x64 and ARM64
  as .msi or portable .zip; there is no Linux build.
